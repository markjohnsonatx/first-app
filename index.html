<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Job Application Tracker</h1>

    <form id="app-form" autocomplete="off">
      <h2 id="form-title">Add application</h2>
      <div class="grid">
        <label>Company
          <input type="text" id="company" required>
        </label>
        <label>Role
          <input type="text" id="role" required>
        </label>
        <label>Date applied
          <input type="date" id="date" required>
        </label>
        <label>Status
          <select id="status">
            <option>Applied</option>
            <option>Interviewing</option>
            <option>Offer</option>
            <option>Rejected</option>
            <option>Withdrawn</option>
          </select>
        </label>
      </div>
      <label>Notes
        <textarea id="notes" rows="3"></textarea>
      </label>
      <div class="actions">
        <button type="submit" id="save-btn">Add</button>
        <button type="button" id="cancel-btn" hidden>Cancel</button>
      </div>
    </form>

    <div id="filters" class="filters" hidden>
      <input type="search" id="search" aria-label="Search applications"
             placeholder="Search company, role or notes">
      <div id="chips" class="chips" role="group" aria-label="Filter by status"></div>
    </div>

    <div class="toolbar">
      <p id="summary" class="summary"></p>
      <div class="toolbar-buttons">
        <button type="button" id="export-btn">Export</button>
        <button type="button" id="import-btn">Import</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
    </div>
    <p id="message" class="message" role="status" hidden></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Role</th>
            <th>Date applied</th>
            <th>Status</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No applications yet. Add your first one above.</p>
      <div id="no-matches" class="empty" hidden>
        <p>No applications match your search. Try a different search or clear the filters.</p>
        <button type="button" id="clear-filters">Clear filters</button>
      </div>
    </div>
  </main>
  <footer id="footer" class="footer">Built with Claude Code · <span id="footer-date"></span></footer>
  <dialog id="import-dialog">
    <form method="dialog" id="import-form">
      <h2>Import records</h2>
      <p id="import-text"></p>
      <div class="actions">
        <button type="button" id="import-replace">Replace existing</button>
        <button type="button" id="import-merge">Merge (skip duplicates)</button>
        <button type="button" id="import-cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
